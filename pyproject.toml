[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcc"
version = "0.1.0"
description = "Research Context Compiler - compiles long research/coding context into compact, recoverable structured state."
requires-python = ">=3.11"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "tiktoken>=0.14.0",
]
# Real-model experiments (never required for `import rcc`):
lab = [
    "torch>=2.13",
    "transformers>=5.3",
    "accelerate>=1.0",
    "packaging>=24",
]
mlx = [
    "mlx>=0.29",
    "mlx-lm>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["rcc", "latent_lab", "evals", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
"core: dependency-light deterministic repository and package contract tests",
"lab_unit: local torch-based lab tests with no model download",
"transformer_integration: tiny/config-built transformer runtime integration tests",
"remote_policy: offline remote/provider policy tests with no provider calls",
"expensive_local_model: tests that may load sizeable local model assets (opt-in)",
    "remote_paid: tests that may contact remote or paid infrastructure (double opt-in)",
]
