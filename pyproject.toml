[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcc"
version = "0.1.0"
description = "Research Context Compiler - compiles long research/coding context into compact, recoverable structured state."
requires-python = ">=3.11"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "tiktoken>=0.14.0",
]
# Real-model experiments (never required for `import rcc`):
lab = [
    "torch>=2.13",
    "transformers>=5.3",
    "accelerate>=1.0",
    "packaging>=24",
]
mlx = [
    "mlx>=0.29",
    "mlx-lm>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["rcc", "latent_lab", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
